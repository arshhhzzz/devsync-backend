spring.application.name=devsync
# ===============================
# DATABASE
# ===============================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/devsync?options=-c%20TimeZone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Natasha}
# ===============================
# JWT
# ===============================
jwt.secret=${JWT_SECRET:THIS_IS_A_DEMO_SECRET_KEY_FOR_DEVSYNC_BACKEND_CHANGE_LATER_123456789}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}
# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
# ===============================
# ACTUATOR
# ===============================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
# ===============================
# RABBITMQ
# ===============================
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:devsync}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:devsync_password}
# ===============================
# DEVSYNC EVENTS
# ===============================
devsync.rabbitmq.exchange=${RABBITMQ_EXCHANGE:devsync.events}
devsync.rabbitmq.notification-queue=${RABBITMQ_NOTIFICATION_QUEUE:devsync.notifications}
devsync.rabbitmq.task-routing-key=${RABBITMQ_TASK_ROUTING_KEY:task.#}
server.port=${SERVER_PORT:8081}